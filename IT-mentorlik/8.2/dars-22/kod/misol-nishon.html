<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍉 Tarvuz ovchisi</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui; background: #1e1e2e; color: white; text-align: center; }
    #maydon { position: relative; width: min(600px, 95vw); height: 400px; background: #2b5b2e; border-radius: 16px; overflow: hidden; margin: 16px auto; }
    .meva { position: absolute; font-size: 42px; cursor: pointer; user-select: none; transition: transform .1s; }
    .meva:active { transform: scale(0.8); }
    button { padding: 12px 24px; border: 0; border-radius: 10px; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>🍉 Tarvuz ovchisi</h1>
    <p>⭐ <b id="ochko">0</b> · ⏱ <b id="vaqt">20</b>s · 🏆 <b id="rekord">0</b></p>
    <div id="maydon"></div>
    <button id="start">▶ Boshlash</button>
  </main>
  <script>
    const maydon = document.querySelector("#maydon");
    const MEVALAR = [["🍉", 3], ["🍎", 1], ["🍌", 1], ["💣", -5]];
    let ochko = 0, vaqt = 20, timer, spawn;
    let rekord = Number(localStorage.getItem("tarvuz-rekord")) || 0;
    document.querySelector("#rekord").textContent = rekord;

    function meva() {
      const [emoji, ball] = MEVALAR[Math.floor(Math.random() * MEVALAR.length)];
      const el = document.createElement("span");
      el.className = "meva";
      el.textContent = emoji;
      el.style.left = Math.random() * (maydon.clientWidth - 50) + "px";
      el.style.top = Math.random() * (maydon.clientHeight - 50) + "px";
      el.addEventListener("click", () => {
        ochko += ball;
        document.querySelector("#ochko").textContent = ochko;
        el.remove();
      });
      maydon.append(el);
      setTimeout(() => el.remove(), 1200);
    }

    function start() {
      ochko = 0; vaqt = 20; maydon.innerHTML = "";
      document.querySelector("#ochko").textContent = 0;
      document.querySelector("#start").disabled = true;
      spawn = setInterval(meva, 600);
      timer = setInterval(() => {
        document.querySelector("#vaqt").textContent = --vaqt;
        if (vaqt <= 0) {
          clearInterval(timer); clearInterval(spawn);
          if (ochko > rekord) { rekord = ochko; localStorage.setItem("tarvuz-rekord", rekord); }
          document.querySelector("#rekord").textContent = rekord;
          document.querySelector("#start").disabled = false;
          alert(`O'yin tugadi! Ochko: ${ochko}`);
        }
      }, 1000);
    }
    document.querySelector("#start").addEventListener("click", start);
  </script>
</body>
</html>
