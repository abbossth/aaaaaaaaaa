<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hakaton o'yini</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui; background: #1e1e2e; color: white; }
    .panel { display: flex; gap: 24px; font-size: 20px; justify-content: center; }
    #maydon { position: relative; width: min(600px, 95vw); height: 400px; background: #313244; border-radius: 16px; overflow: hidden; margin: 16px auto; }
    button { padding: 12px 24px; border: 0; border-radius: 10px; font-size: 18px; cursor: pointer; }
    .yashirin { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>🎮 O'yin nomi</h1>
    <div class="panel"><span>⭐ Ochko: <b id="ochko">0</b></span><span>⏱ <b id="vaqt">30</b>s</span><span>🏆 Rekord: <b id="rekord">0</b></span></div>
    <div id="maydon"></div>
    <button id="start">▶ Boshlash</button>
    <p id="natija"></p>
  </main>
  <script>
    // === Holat (state) ===
    let ochko = 0;
    let vaqt = 30;
    let timer = null;
    let rekord = Number(localStorage.getItem("rekord")) || 0;

    const $ = (s) => document.querySelector(s);
    $("#rekord").textContent = rekord;

    function yangila() {
      $("#ochko").textContent = ochko;
      $("#vaqt").textContent = vaqt;
    }

    function start() {
      ochko = 0; vaqt = 30; yangila();
      $("#natija").textContent = "";
      $("#start").classList.add("yashirin");
      timer = setInterval(() => {
        vaqt--; yangila();
        if (vaqt <= 0) tugat();
      }, 1000);
      // TODO: o'yin mantiqini shu yerdan boshlang
    }

    function tugat() {
      clearInterval(timer);
      if (ochko > rekord) {
        rekord = ochko;
        localStorage.setItem("rekord", rekord);
        $("#rekord").textContent = rekord;
        $("#natija").textContent = `🎉 Yangi rekord: ${ochko}!`;
      } else {
        $("#natija").textContent = `O'yin tugadi! Ochko: ${ochko}`;
      }
      $("#start").textContent = "🔁 Qayta o'ynash";
      $("#start").classList.remove("yashirin");
    }

    $("#start").addEventListener("click", start);
  </script>
</body>
</html>
