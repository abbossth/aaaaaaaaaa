<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventlar</title>
  <style>
    body { font-family: system-ui; max-width: 900px; margin: 0 auto; padding: 20px; transition: 0.3s; }
    body.qorongi { background: #212529; color: #f1f3f5; }
    .panel { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
    button { padding: 8px 14px; border: 0; border-radius: 8px; cursor: pointer; background: #e9ecef; }
    button.faol { background: #7048e8; color: white; }
    input { padding: 8px; border-radius: 8px; border: 1px solid #ced4da; }
    .galereya { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .karta { border: 1px solid #dee2e6; border-radius: 12px; padding: 12px; }
    #hisob { font-size: 40px; }
  </style>
</head>
<body>
  <button id="rejim">🌙 Dark mode</button>

  <h2>Hisoblagich</h2>
  <div class="panel"><button id="minus">−</button><span id="hisob">0</span><button id="plus">+</button><button id="nol">Reset</button></div>

  <h2>Mahsulotlar</h2>
  <div class="panel">
    <input id="qidiruv" placeholder="Qidirish...">
    <button class="filtr faol" data-kategoriya="hammasi">Hammasi</button>
    <button class="filtr" data-kategoriya="telefon">Telefonlar</button>
    <button class="filtr" data-kategoriya="aksessuar">Aksessuarlar</button>
  </div>
  <div class="galereya" id="galereya"></div>

  <script src="app.js"></script>
</body>
</html>
