<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Profil kartochkasi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      margin: 0;
      padding: 60px 20px;
    }

    .karta {
      width: 320px;
      margin: 0 auto;
      padding: 30px;
      background-color: white;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 5px solid #764ba2;
      margin-bottom: 15px;
    }

    .karta h2 { margin: 0; color: #333; }
    .karta p { color: #777; margin: 8px 0 20px; }

    .tugma {
      display: inline-block;
      padding: 12px 30px;
      background-color: #764ba2;
      color: white;
      text-decoration: none;
      border-radius: 30px;
    }
  </style>
</head>
<body>
  <div class="karta">
    <img class="avatar" src="https://api.dicebear.com/9.x/adventurer/svg?seed=Aziz" alt="Aziz avatari">
    <h2>Aziz Karimov</h2>
    <p>8.10 · Bo'lajak full-stack dasturchi 🚀</p>
    <a class="tugma" href="#">Obuna bo'lish</a>
  </div>
</body>
</html>
