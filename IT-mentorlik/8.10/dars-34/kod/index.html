<!DOCTYPE html>
<html lang="uz">
<head>

  <title>DOM sehrgari 🪄</title>
  <style>

    #royxat li { padding: 6px; }
    .yangi { background: #e8f5e9; border-radius: 8px; }
    button { padding: 10px 16px; border: none; border-radius: 10px; background: #4f46e5; color: #fff; cursor: pointer; margin: 4px; }
  </style>
</head>
<body>
  <h1 id="sarlavha">DOM sehrgari 🪄</h1>
  <p class="matn">Bu matnni JavaScript o'zgartiradi.</p>

  <div class="karta">
    <img id="rasm" src="https://cataas.com/cat" alt="Mushuk">
    <h2 id="ism">Ism Familiya</h2>
    <p id="kasb">Kasb</p>
    <div class="yulduz" id="yulduzlar"></div>
  </div>

  <h3>Sevimli o'yinlarim</h3>
  <ul id="royxat"></ul>

  <button onclick="sehr()">🪄 Sehr!</button>

  <script src="app.js"></script>
</body>
</html>
