<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahsulotlar galereyasi</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f1f3f5; margin: 0; padding: 30px; }
    h1 { text-align: center; }

    .galereya { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1100px; margin: 0 auto; }

    .karta {
      flex: 1 1 250px;
      display: flex;
      flex-direction: column;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }
    .karta img { width: 100%; height: 170px; object-fit: cover; }
    .karta .ichi { display: flex; flex-direction: column; flex: 1; padding: 16px; }
    .karta h3 { margin: 0 0 8px; }
    .karta .narx { color: #7048e8; font-weight: bold; font-size: 20px; }
    .karta .tugma {
      margin-top: auto;            /* tugmani pastga "yopishtiradi" */
      padding: 12px;
      background: #7048e8;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
    }
    .yangi { position: relative; }
    .yangi::before { content: "YANGI"; position: absolute; top: 10px; left: 10px; background: #fa5252; color: white; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>🛍 Mening do'konim</h1>
  <div class="galereya">
    <div class="karta yangi">
      <img src="https://picsum.photos/400/300?1" alt="Telefon">
      <div class="ichi"><h3>Telefon</h3><p>Kuchli kamera va batareya.</p><p class="narx">2 900 000 so'm</p><a class="tugma" href="#">Savatga</a></div>
    </div>
    <div class="karta">
      <img src="https://picsum.photos/400/300?2" alt="Noutbuk">
      <div class="ichi"><h3>Noutbuk</h3><p>O'qish va dasturlash uchun ideal. Yengil, tez va uzoq ishlaydi.</p><p class="narx">6 800 000 so'm</p><a class="tugma" href="#">Savatga</a></div>
    </div>
    <div class="karta">
      <img src="https://picsum.photos/400/300?3" alt="Quloqchin">
      <div class="ichi"><h3>Quloqchin</h3><p>Shovqinni yutadi.</p><p class="narx">650 000 so'm</p><a class="tugma" href="#">Savatga</a></div>
    </div>
    <div class="karta">
      <img src="https://picsum.photos/400/300?4" alt="Soat">
      <div class="ichi"><h3>Aqlli soat</h3><p>Qadamlar va yurak urishi.</p><p class="narx">450 000 so'm</p><a class="tugma" href="#">Savatga</a></div>
    </div>
  </div>
</body>
</html>
