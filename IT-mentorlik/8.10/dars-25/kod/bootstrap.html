<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">GameZone</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">O'yinlar</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Turnirlar</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5 text-center">
    <h1 class="display-4 fw-bold">Eng yaxshi o'yinlar</h1>
    <p class="lead">Bootstrap bilan 10 daqiqada yasalgan sahifa</p>
    <button class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#oyna">Qo'shilish</button>
  </div>

  <div class="container">
    <div class="row g-4">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100"><img src="https://picsum.photos/400/200?7" class="card-img-top" alt="">
          <div class="card-body"><h5 class="card-title">Minecraft</h5><p class="card-text">Qurish va omon qolish.</p><a href="#" class="btn btn-outline-primary">Batafsil</a></div></div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100"><img src="https://picsum.photos/400/200?8" class="card-img-top" alt="">
          <div class="card-body"><h5 class="card-title">FIFA</h5><p class="card-text">Futbol simulyatori.</p><a href="#" class="btn btn-outline-primary">Batafsil</a></div></div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100"><img src="https://picsum.photos/400/200?9" class="card-img-top" alt="">
          <div class="card-body"><h5 class="card-title">Chess.com</h5><p class="card-text">Onlayn shaxmat.</p><a href="#" class="btn btn-outline-primary">Batafsil</a></div></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="oyna"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Ro'yxatdan o'tish</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><input class="form-control mb-2" placeholder="Ism"><input class="form-control" placeholder="Email"></div>
    <div class="modal-footer"><button class="btn btn-success">Yuborish</button></div>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
