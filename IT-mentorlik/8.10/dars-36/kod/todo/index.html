<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mening vazifalarim ✅</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; background: #f5f3ff; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; font-size: 16px; border-radius: 8px; border: 2px solid #c4b5fd; }
    button { padding: 10px 14px; border: none; border-radius: 8px; background: #7c3aed; color: #fff; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { background: #fff; padding: 12px; border-radius: 10px; margin: 8px 0; display: flex; align-items: center; gap: 8px; }
    li span { flex: 1; cursor: pointer; }
    li.bajarildi span { text-decoration: line-through; color: #9ca3af; }
    li button { background: #ef4444; }
    #xato { color: #ef4444; }
  </style>
</head>
<body>
  <h1>✅ Mening vazifalarim</h1>
  <form id="forma">
    <input id="matn" placeholder="Yangi vazifa..." autocomplete="off">
    <button>Qo'shish</button>
  </form>
  <p id="xato"></p>
  <ul id="royxat"></ul>
  <p id="hisob"></p>
  <script src="app.js"></script>
</body>
</html>
