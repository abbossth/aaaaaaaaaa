# /etc/nginx/sites-available/mvp
# Yoqish: sudo ln -s /etc/nginx/sites-available/mvp /etc/nginx/sites-enabled/
#         sudo rm /etc/nginx/sites-enabled/default
#         sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;            # domen bo'lsa: mvp.example.uz

    # React (Vite) build: cd web && npm run build → dist/ ni /var/www/mvp ga nusxalash
    root /var/www/mvp;
    index index.html;

    # Siqish (tezroq yuklanish)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik fayllarni brauzer uzoq keshlasin
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API → Express (systemd servisi, 27-dars)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Xavfsizlik sarlavhalari
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
}
